<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Simulador Licencia A-I
    </title>

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>


<body>

<div class="container">


    <!-- CABECERA -->

    <div class="header">

        <h1>
            🚗 Simulador Licencia A-I
        </h1>

        <p>
            Práctica para el examen teórico de conducción
        </p>

    </div>



    <!-- ======================
         MENÚ
    ======================= -->

    <div
        class="card"
        id="homeScreen"
    >

        <h2>
            ¿Cómo quieres practicar?
        </h2>


        <div class="menu">


            <button
                class="menu-button"
                onclick="startQuickPractice()"
            >

                <span class="menu-title">
                    ⚡ Práctica rápida
                </span>

                <span class="menu-description">
                    10 preguntas seleccionadas al azar.
                </span>

            </button>


            <button
                class="menu-button"
                onclick="startFullPractice()"
            >

                <span class="menu-title">
                    📚 Banco completo
                </span>

                <span class="menu-description">
                    Practica todas las preguntas disponibles.
                </span>

            </button>


        </div>

    </div>



    <!-- ======================
         QUIZ
    ======================= -->

    <div
        class="card hidden"
        id="quizCard"
    >


        <div class="top-info">

            <span id="questionNumber"></span>

            <span id="scoreInfo">
                Correctas: 0
            </span>

        </div>


        <div class="progress-container">

            <div
                class="progress-bar"
                id="progressBar"
            ></div>

        </div>

        <div
            id="mtcQuestionNumber"
            style="
                font-size: 13px;
                color: #777;
                margin-bottom: 8px;
            "
        ></div>
        <div
            class="question"
            id="questionText"
        ></div>


        <img
            id="questionImage"
            class="question-image"
            alt="Imagen relacionada con la pregunta"
        >


        <div
            class="answers"
            id="answersContainer"
        ></div>


        <div
            class="feedback"
            id="feedback"
        ></div>


        <button
            class="primary-button hidden"
            id="nextButton"
        >
            Siguiente
        </button>


        <button
            class="secondary-button"
            onclick="goHome()"
        >
            Salir de la práctica
        </button>


    </div>



    <!-- ======================
         RESULTADOS
    ======================= -->

    <div
        class="card result hidden"
        id="resultCard"
    >


        <h2>
            🎯 Resultado
        </h2>


        <div
            class="score"
            id="finalScore"
        ></div>


        <p id="finalMessage"></p>


        <div class="result-details">


            <div class="result-stat">

                <span>
                    Porcentaje
                </span>

                <strong id="percentage"></strong>

            </div>


            <div class="result-stat">

                <span>
                    Correctas
                </span>

                <strong id="correctResult"></strong>

            </div>


            <div class="result-stat">

                <span>
                    Incorrectas
                </span>

                <strong id="errorResult"></strong>

            </div>


        </div>


        <button
            id="retryErrors"
            class="primary-button hidden"
            onclick="practiceErrors()"
        >
            🔁 Practicar mis errores
        </button>


        <button
            class="secondary-button"
            onclick="goHome()"
        >
            Volver al menú
        </button>


    </div>


</div>


<script src="js/preguntas.js"></script>

<script src="js/app.js"></script>


</body>

</html>
